message ListGrokBotAgentsRequest {
  optional string role = 1;
  optional bool include_team_agents = 2;
  optional bool added_team_agents_only = 3;
}
message ListGrokBotAgentsResponse {
  repeated GrokBotAgent agents = 1;
  repeated GrokBotSlackConnection slack_connections = 2;
  bool truncated = 3;
  repeated GrokBotTeamsConnection teams_connections = 4;
}
message GrokBotAgent {
  string id = 1;
  string legacy_agent_id = 2;
  string name = 3;
  string description = 4;
  string title = 5;
  string avatar_shape = 6;
  string avatar_color = 7;
  optional string avatar_version = 8;
  optional string avatar_url = 9;
  int64 created_at_ms = 10;
  int64 updated_at_ms = 11;
  string agent_id = 12;
  string harness = 13;
  string role = 14;
  optional GrokBotAgentVisibility visibility = 15;
  optional int32 team_id = 16;
  optional bool viewer_is_owner = 17;
  string viewer_session_id = 18;
  GrokBotAgentKind kind = 19;
  repeated string member_agent_ids = 20;
  optional string owner_display_name = 21;
  repeated GrokBotRoomPerson people = 22;
  optional google.protobuf.Timestamp published_at = 23;
  bool team_default_for_viewer = 24;
  optional string voice_id = 25;
  optional float voice_speed = 26;
  optional string voice_language = 27;
  optional bool viewer_can_manage = 28;
  optional bool drafting_disabled = 29;
  optional GrokBotAgentRoutinePolicy routine_policy = 30;
  optional GrokBotAgentViewerAccess viewer_access = 31;
  optional bool access_grants_only = 32;
  repeated GrokBotAgentViewerAction viewer_allowed_actions = 33;
  repeated GrokBotAgentSuggestion suggestions = 34;
  optional bool access_owner_only = 35;
}
message GrokBotRoomPerson {
  string display_name = 1;
  optional string avatar_url = 2;
  bool is_viewer = 3;
  optional int32 user_id = 4;
}
message GrokBotAgentRoutinePolicy {
  bool allow_collaborator_creation = 1;
  repeated GrokBotAutomationPolicyAction viewer_allowed_actions = 2;
}
message GrokBotAgentSuggestion {
  string id = 1;
  string icon = 2;
  string title = 3;
  string detail = 4;
  string prompt = 5;
}
message GrokBotSlackConnection {
  string agent_id = 1;
  bool connected = 2;
  optional string workspace_name = 3;
  optional string install_url = 5;
  optional string unavailable_reason = 6;
  optional bool pending_admin_approval = 7;
  optional bool needs_manifest_update = 8;
  optional string reinstall_url = 9;
  optional bool approval_denied = 10;
  optional bool app_unreachable = 11;
  optional bool removed_in_slack = 12;
  optional bool approval_request_unsent = 13;
}
message GrokBotTeamsConnection {
  string agent_id = 1;
  GrokBotTeamsInstallState install_state = 2;
  optional string tenant_id = 3;
  optional string tenant_display_name = 4;
  int32 installed_team_count = 5;
  repeated GrokBotTeamsInstalledTeam installed_teams = 6;
}
message GrokBotTeamsInstalledTeam {
  string team_id = 1;
  string display_name = 2;
  bool rsc_granted = 3;
  int64 installed_at_ms = 4;
}
message SendGrokBotUserMessageRequest {
  string agent_id = 1;
  string message_id = 2;
  string text = 3;
  int64 sent_at_ms = 4;
  optional string rich_text = 5;
  optional string reply_to_id = 6;
  bool is_fork = 7;
  optional string reply_quote = 24;
  repeated string attachment_paths = 8;
  repeated string attachment_names = 9;
  optional string traceparent = 10;
  optional int64 enter_epoch_ms = 11;
  optional int64 composed_at_ms = 12;
  GrokBotClientSurface source = 13;
  optional string mcp_config_json = 14;
  string session_id = 15;
  optional string machine_id = 16;
  optional bool one_password_app_installed = 17;
  GrokBotUserMessageInitiator initiator = 18;
  optional string task_id = 19;
  optional string language = 20;
  GrokBotSendSource send_source = 21;
  optional int64 first_sent_age_ms = 22;
  optional bool renders_mcp_elicitation_forms = 25;
}
message SendGrokBotUserMessageResponse {
  bool dispatched = 1;
  GrokBotTemporalHarnessMode mode = 2;
  optional string workflow_id = 3;
  GrokBotUserMessageDelivery delivery = 4;
  optional GrokBotHarnessRefusal refusal = 5;
}
message GrokBotHarnessRefusal {
  string failure_code = 1;
  string message = 2;
}
message GetGrokBotSendStatusRequest {
  string agent_id = 1;
  string message_id = 2;
  string session_id = 3;
  optional int64 first_sent_age_ms = 4;
  optional string task_id = 5;
}
message GetGrokBotSendStatusResponse {
  GrokBotSendStatus status = 1;
  optional string echo_entry_id = 2;
  optional string rejection_code = 3;
  optional int64 accepted_at_ms = 4;
}
message ListGrokBotTranscriptEntriesRequest {
  string agent_id = 1;
  optional uint32 generation = 2;
  optional uint64 before_seq = 3;
  uint32 limit = 4;
  string session_id = 5;
  optional int64 unread_boundary_ms = 6;
}
message ListGrokBotTranscriptEntriesResponse {
  repeated GrokBotTranscriptEntry entries = 1;
  uint32 generation = 2;
  repeated string cloud_agent_peer_ids = 3;
  bool cloud_agent_peer_ids_known = 4;
  optional GrokBotTranscriptUnreadAnchor unread_anchor = 5;
  bool updated_seq_locked = 6;
}
message GrokBotTranscriptEntry {
  uint64 seq = 1;
  string entry_kind = 2;
  optional bytes body = 3;
  optional string blob_hash = 4;
  uint64 updated_seq = 5;
  optional string entry_id = 6;
  bool body_omitted = 7;
}
message GrokBotTranscriptUnreadAnchor {
  bool has_newer_rows = 1;
  string entry_id = 2;
  uint64 seq = 3;
  uint32 newer_rows = 4;
}
message WatchGrokBotTranscriptsRequest {
  repeated GrokBotTranscriptCursor cursors = 1;
  optional bool include_unlisted_agents = 2;
  uint32 inline_body_max_bytes = 3;
}
message GrokBotTranscriptCursor {
  string agent_id = 1;
  uint32 generation = 2;
  uint64 after_updated_seq = 3;
  string session_id = 4;
}
message GrokBotTranscriptWatchFrame {
  oneof frame {
    GrokBotTranscriptWatchConnected connected = 1;
    GrokBotTranscriptWatchRows rows = 2;
    GrokBotTranscriptWatchCleared cleared = 3;
    GrokBotTranscriptWatchCursorTooOld cursor_too_old = 4;
    GrokBotTranscriptWatchHeartbeat heartbeat = 5;
    GrokBotTranscriptWatchAgentState agent_state = 6;
    GrokBotTranscriptWatchComputerActions computer_actions = 7;
    GrokBotTranscriptWatchAgentStateChanged agent_state_changed = 8;
    GrokBotTranscriptWatchTurnFailed turn_failed = 9;
    GrokBotTranscriptWatchRosterChanged roster_changed = 10;
    GrokBotTranscriptWatchBoxState box_state = 11;
    GrokBotTranscriptWatchPageTitleChanged page_title_changed = 12;
  }
}
message GrokBotTranscriptWatchConnected {
  string stream_id = 1;
  int64 server_time_ms = 2;
  int64 absolute_lifetime_ms = 3;
}
message GrokBotTranscriptWatchRows {
  string agent_id = 1;
  uint32 generation = 2;
  repeated GrokBotTranscriptEntry entries = 3;
  repeated GrokBotTranscriptEntryDelete deletes = 4;
  bool replay = 5;
  string session_id = 6;
}
message GrokBotTranscriptEntryDelete {
  uint64 seq = 1;
  uint64 updated_seq = 2;
  optional string entry_id = 3;
}
message GrokBotTranscriptWatchCleared {
  string agent_id = 1;
  uint32 new_generation = 2;
  string session_id = 3;
}
message GrokBotTranscriptWatchCursorTooOld {
  string agent_id = 1;
  uint32 generation = 2;
  string session_id = 3;
}
message GrokBotTranscriptWatchHeartbeat {
  int64 server_time_ms = 1;
}
message GrokBotTranscriptWatchAgentState {
  repeated GrokBotAgentLiveState live = 1;
  bool snapshot = 2;
  repeated GrokBotAgentClientState client = 3;
}
message GrokBotAgentLiveState {
  string agent_id = 1;
  bool is_running = 2;
  bool is_composing_message = 3;
  bool is_retrying = 4;
  optional GrokBotAgentLiveActivity activity = 5;
  optional GrokBotAgentAwaitingState awaiting = 6;
  int64 updated_at_ms = 7;
  int64 stale_after_ms = 8;
  optional string box_handoff_request_id = 9;
  optional string box_handoff_instruction = 10;
  string session_id = 11;
  optional string active_group_member_id = 12;
  bool has_running_subagents = 13;
  optional string surface_task_id = 14;
  repeated string working_task_ids = 15;
  optional GrokBotTurnSettlement last_turn_settlement = 16;
}
message GrokBotAgentLiveActivity {
  string kind = 1;
  string tool = 2;
  string detail = 3;
  string target = 4;
  string call_id = 5;
}
message GrokBotAgentAwaitingState {
  string tab_id = 1;
  string reason = 2;
  int64 since_ms = 3;
}
message GrokBotTurnSettlement {
  string turn_id = 1;
  string outcome = 2;
  int64 settled_at_ms = 3;
}
message GrokBotAgentClientState {
  string agent_id = 1;
  optional int64 last_viewed_at_ms = 2;
  uint32 unread_count = 3;
  optional int64 last_activity_at_ms = 4;
  optional string last_entry_id = 5;
  optional string last_entry_kind = 6;
  optional string last_message_id = 7;
  optional string last_message_preview = 8;
  bool notifications_enabled = 9;
  bool notify_on_updates_enabled = 10;
  bool hidden_from_sidebar = 11;
  int64 updated_at_ms = 12;
  optional GrokBotAgentEntryPreview last_entry_preview = 13;
  optional string last_message_task_id = 14;
  optional bool removed_from_sidebar = 15;
  uint32 unread_thread_count = 16;
}
message GrokBotAgentEntryPreview {
  oneof preview {
    GrokBotAgentEntryPreview_Text text = 1;
    GrokBotAgentEntryPreview_AgentMessage sent_agent_message = 2;
    GrokBotAgentEntryPreview_AgentMessage received_agent_message = 3;
    GrokBotAgentEntryPreview_Attachments attachments = 4;
    GrokBotAgentEntryPreview_Link link = 5;
    GrokBotAgentEntryPreview_WidgetPrompt widget_prompt = 6;
    GrokBotAgentEntryPreview_WidgetAnswered widget_answered = 7;
    GrokBotAgentEntryPreview_WidgetOptions widget_options = 8;
  }
}
message GrokBotAgentEntryPreview_Text {
  string text = 1;
  optional string copy_json = 2;
}
message GrokBotAgentEntryPreview_AgentMessage {
  string peer_name = 1;
  string text = 2;
}
message GrokBotAgentEntryPreview_Attachments {
  uint32 count = 1;
  repeated GrokBotAgentEntryPreview_AttachmentKindCount kinds = 2;
}
message GrokBotAgentEntryPreview_AttachmentKindCount {
  string kind = 1;
  uint32 count = 2;
}
message GrokBotAgentEntryPreview_Link {
  string url = 1;
}
message GrokBotAgentEntryPreview_WidgetPrompt {
  string prompt = 1;
}
message GrokBotAgentEntryPreview_WidgetAnswered {
  string prompt = 1;
  string answer = 2;
}
message GrokBotAgentEntryPreview_WidgetOptions {
  string prompt = 1;
  repeated string options = 2;
}
message GrokBotTranscriptWatchComputerActions {
  repeated GrokBotComputerAction actions = 1;
}
message GrokBotComputerAction {
  string agent_id = 1;
  string type = 2;
  double x = 3;
  double y = 4;
  string button = 5;
  uint32 count = 6;
  int64 at_ms = 7;
}
message GrokBotTranscriptWatchAgentStateChanged {
  string agent_id = 1;
  repeated string families = 2;
  int64 changed_at_ms = 3;
}
message GrokBotTranscriptWatchTurnFailed {
  string agent_id = 1;
  string session_id = 2;
  string turn_id = 3;
  GrokBotTurnFailureCode code = 4;
  string summary = 5;
  int64 failed_at_ms = 6;
  optional ErrorDetails error_details = 7;
  GrokBotTurnFailureAccount account = 8;
}
message ErrorDetails {
  int32 /* unresolved enum Cm */ error = 1;
  CustomErrorDetails details = 2;
  optional bool is_expected = 3;
}
message CustomErrorDetails {
  string title = 1;
  string detail = 2;
  optional bool allow_command_links_potentially_unsafe_please_only_use_for_handwritten_trusted_markdown = 3;
  optional bool is_retryable = 4;
  optional bool show_request_id = 5;
  optional bool should_show_immediate_error = 6;
  repeated ErrorButton buttons = 8;
  map<string, string> additional_info = 7;
  repeated PlanChoice plan_choices = 9;
  optional ErrorAnalyticsMetadata analytics_metadata = 10;
}
message ErrorButton {
  string label = 1;
  oneof action {
    UpgradeAction upgrade = 2;
    SwitchModelAction switch_model = 3;
    ConfigureSpendLimitAction configure_spend_limit = 4;
    UrlAction url = 5;
    UpgradeChoice upgrade_choice = 6;
    DashboardAction dashboard_action = 7;
    ReloadWindowAction reload_window = 8;
    ClientAction client_action = 9;
  }
}
message UpgradeAction {
  string membership_to_upgrade_to = 1;
  optional bool try_immediate_upgrade = 2;
  optional bool allow_trial = 3;
  optional DashboardAction dashboard_action = 4;
}
message DashboardAction {
  string action = 1;
  map<string, string> args = 2;
  optional string success_message = 3;
}
message SwitchModelAction {
  optional string suggested_model = 1;
  repeated SwitchModelAction_ModelParameterValue parameters = 2;
  optional bool max_mode = 3;
}
message SwitchModelAction_ModelParameterValue {
  string id = 1;
  string value = 2;
}
message ConfigureSpendLimitAction {
  string confirm_label = 1;
}
message UrlAction {
  string url = 1;
}
message UpgradeChoice {
}
message ReloadWindowAction {
}
message ClientAction {
  string command_id = 1;
  map<string, string> args = 2;
}
message PlanChoice {
  string label = 1;
  optional string sublabel = 2;
  optional string description = 3;
  string value = 4;
}
message ErrorAnalyticsMetadata {
