service GrokBotService {
  rpc ListGrokBotAgents(ListGrokBotAgentsRequest) returns (ListGrokBotAgentsResponse);
  rpc SendGrokBotUserMessage(SendGrokBotUserMessageRequest) returns (SendGrokBotUserMessageResponse);
  rpc GetGrokBotSendStatus(GetGrokBotSendStatusRequest) returns (GetGrokBotSendStatusResponse);
  rpc ListGrokBotTranscriptEntries(ListGrokBotTranscriptEntriesRequest) returns (ListGrokBotTranscriptEntriesResponse);
  rpc WatchGrokBotTranscripts(WatchGrokBotTranscriptsRequest) returns (stream GrokBotTranscriptWatchFrame);
  rpc InterruptGrokBotAgentRun(InterruptGrokBotAgentRunRequest) returns (InterruptGrokBotAgentRunResponse);
  rpc MintSandVoiceCallSecret(MintSandVoiceCallSecretRequest) returns (MintSandVoiceCallSecretResponse);
  rpc VoiceCallHarnessSession(VoiceCallHarnessSessionRequest) returns (VoiceCallHarnessSessionResponse);
  rpc VoiceCallHarnessTool(VoiceCallHarnessToolRequest) returns (VoiceCallHarnessToolResponse);
  rpc RecordGrokBotVoiceCall(RecordGrokBotVoiceCallRequest) returns (RecordGrokBotVoiceCallResponse);
  rpc ListGrokBotAgentStatuses(ListGrokBotAgentStatusesRequest) returns (ListGrokBotAgentStatusesResponse);
  rpc GetGrokBotUserRuntimeSettings(GetGrokBotUserRuntimeSettingsRequest) returns (GetGrokBotUserRuntimeSettingsResponse);
  rpc SetGrokBotAgentClientState(SetGrokBotAgentClientStateRequest) returns (SetGrokBotAgentClientStateResponse);
  rpc RespondGrokBotWidget(RespondGrokBotWidgetRequest) returns (RespondGrokBotWidgetResponse);
  rpc DismissGrokBotWidget(DismissGrokBotWidgetRequest) returns (DismissGrokBotWidgetResponse);
  rpc ResolveGrokBotAutoReviewApproval(ResolveGrokBotAutoReviewApprovalRequest) returns (ResolveGrokBotAutoReviewApprovalResponse);
  rpc SendGrokBotDraft(SendGrokBotDraftRequest) returns (SendGrokBotDraftResponse);
  rpc DiscardGrokBotDraft(DiscardGrokBotDraftRequest) returns (DiscardGrokBotDraftResponse);
  rpc SubmitGrokBotUserForm(SubmitGrokBotUserFormRequest) returns (SubmitGrokBotUserFormResponse);
  rpc DismissGrokBotUserForm(DismissGrokBotUserFormRequest) returns (DismissGrokBotUserFormResponse);
  rpc ReactToGrokBotMessage(ReactToGrokBotMessageRequest) returns (ReactToGrokBotMessageResponse);
  rpc UpdateGrokBotUserRuntimeSettings(UpdateGrokBotUserRuntimeSettingsRequest) returns (UpdateGrokBotUserRuntimeSettingsResponse);
  rpc ResolveGrokBotAttachmentReads(ResolveGrokBotAttachmentReadsRequest) returns (ResolveGrokBotAttachmentReadsResponse);
}

service AiService {
  rpc TextToSpeech(TextToSpeechRequest) returns (TextToSpeechResponse);
  rpc TranscribeAudio(TranscribeAudioRequest) returns (TranscribeAudioResponse);
}
