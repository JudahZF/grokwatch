# Xcode project spec. Regenerate with: cd watch && xcodegen
name: GrokWatch
options:
  deploymentTarget:
    watchOS: "10.0"
  # false: with true, XcodeGen 2.44 puts Signing.xcconfig in an orphan group with a random id on every run.
  # No source path is nested, so nothing else in the project changes.
  createIntermediateGroups: false
# Signing identity: Signing.xcconfig, overridden by the git-ignored Local.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    exactVersion: 1.39.0 # must match the protoc-gen-swift that produced Generated/
  QRCodeGenerator:
    url: https://github.com/fwcd/swift-qrcode-generator
    from: 2.0.2
targets:
  GrokWatch:
    type: application
    platform: watchOS
    sources: [GrokWatch, Shared]
    dependencies:
      - package: SwiftProtobuf
      - package: QRCodeGenerator
      - target: GrokWatchWidgets
    entitlements:
      path: GrokWatch/GrokWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: GrokWatch/Info.plist
      properties:
        CFBundleDisplayName: Grokwatch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: true
        NSMicrophoneUsageDescription: Grokwatch uses the microphone for voice calls with your Bots.
        UIBackgroundModes: [voip] # CallKit reads this; watchOS only allows the call's WebSocket during a call
        BGTaskSchedulerPermittedIdentifiers: [glance] # AppSession.refreshID
        AppGroupID: $(APP_GROUP_ID) # Glance.appGroup reads this
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [grokwatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Complication. Reads the unread snapshot the app writes to the App Group (Shared/Glance.swift).
  GrokWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [Widgets, Shared]
    entitlements:
      path: Widgets/GrokWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Grokwatch
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        AppGroupID: $(APP_GROUP_ID) # Glance.appGroup reads this
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
  # Unit tests for the pure protocol and model logic. Hosted by the app, which shows nothing under test.
  GrokWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [Tests]
    dependencies:
      - target: GrokWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GrokWatch:
    build:
      targets:
        GrokWatch: all
    test:
      targets: [GrokWatchTests]
